services:
  shorts-agent:
    build: .
    image: youtube-shorts-agent:latest
    container_name: youtube-shorts-agent
    ports:
      - "8501:8501"          # 로컬 브라우저: http://localhost:8501
    env_file:
      - .env                 # YOUTUBE_API_KEY / ANTHROPIC_API_KEY
    environment:
      DATA_DIR: /data
      TZ: Asia/Seoul
    volumes:
      - shorts-data:/data    # 크롤링 결과 영속화
      # 개발용 소스 마운트 — 코드·HTML·CSS 수정이 새로고침만으로 반영됩니다.
      # 이미지에 담긴 코드로만 돌리려면 아래 세 줄을 주석 처리하세요.
      - ./app:/srv/app
      - ./web:/srv/web
      - ./streamlit_app.py:/srv/streamlit_app.py
    restart: unless-stopped

volumes:
  shorts-data:

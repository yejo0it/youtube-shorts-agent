# 검증된 라이트 팔레트에 맞춰 테마를 고정한다.
# (차트 색상은 이 표면색 기준으로 대비/CVD 검증을 통과한 값들이다)
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
# "Clear caches" 모달 차단.
#   프런트엔드는 입력창 밖에서 'c' 키를 누르면 개발자용 캐시 삭제 모달을 띄운다
#   (streamlit 정적 번들 handleKeyDown: case 'c' → openClearCacheDialog).
#   이 단축키와 메뉴 항목은 toolbarMode 가 DEVELOPER/AUTO(로컬호스트) 일 때만 열리고
#   minimal 이면 완전히 비활성화된다. 앱 코드에도 @st.cache_data/@st.cache_resource 가
#   없으므로(상태는 st.session_state 로 관리) 지울 캐시 자체가 없다.
toolbarMode = "minimal"

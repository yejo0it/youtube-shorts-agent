events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name shorts-agent.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name shorts-agent.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/shorts-agent.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shorts-agent.duckdns.org/privkey.pem;

        # 1. 숨김 파일 및 민감한 경로 접근 차단 (.env, .git 등)
        location ~ /\. {
            deny all;
            return 404;
        }

        # 2. 메인 애플리케이션 프록시
        location / {
            proxy_pass http://shorts-agent:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamlit WebSocket 지원
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}